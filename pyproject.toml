[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinynn-compiler"
version = "0.1.0"
description = "An ahead-of-time neural-network compiler for edge inference with ONNX import, graph optimizations, C++/embedded-C codegen, and int8 quantization."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.14",
]
examples = [
    "onnx>=1.14",
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.0",
    "onnx>=1.14",
    "scikit-learn>=1.3",
]

[project.scripts]
tinynn = "tinynn.cli:main"

[tool.setuptools.packages.find]
include = ["tinynn*"]
